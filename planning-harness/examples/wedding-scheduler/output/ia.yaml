meta:
  project: wedding-scheduler
  updated: "2026-09-05"

# ─────────────────────────────────────────
# 1. 엔티티
# ─────────────────────────────────────────
entities:
  - id: ENT-01
    name: 지인
    description: 예비부부가 청첩장을 전달할 대상. 신랑측·신부측 계정 중 한쪽이 등록한다.
    fields:
      - name: name
        type: string
        required: true
        note: 이름
      - name: phone
        type: string
        required: true
        note: 연락처. 여러 커플에 걸친 초대받은 지인(ROLE-03) 식별의 전역 키로 쓰인다 (TBD 신뢰도, users.md 참고)
      - name: memo
        type: string
        required: false
        note: 관계에 대한 자유 메모. 예 — 대학 동기
      - name: registered_by
        type: ref
        required: true
        note: 등록한 계정 (ENT-06)
      - name: created_at
        type: datetime
        required: true
    relations:
      - to: ENT-02
        type: N:M
        note: >
          RISK-01. 결정 1) 중복 소속 허용 2) 지인 목록에서 소속 그룹 태그를 모두 노출(대표 그룹 지정 없음)
          3) 그룹을 삭제해도 지인 레코드는 남고 해당 그룹 태그만 제거된다.
      - to: ENT-03
        type: N:M
        note: 한 지인이 여러 모임에 동시에 참가할 수 있다(1:1 모임 포함). 분류 모호성이 아니라 자연스러운 다중 참여이므로 별도 리스크 결정은 불필요.

  - id: ENT-02
    name: 그룹
    description: 지인을 묶는 사용자 정의 분류(예 — 대학 동기, 직장 동료, 동네 친구). 계정별로 독립적으로 관리된다.
    fields:
      - name: name
        type: string
        required: true
      - name: owner_account
        type: ref
        required: true
        note: 이 그룹을 만든 계정 (ENT-06)
      - name: created_at
        type: datetime
        required: true
    relations: []

  - id: ENT-03
    name: 모임
    description: 하나 이상의 지인과 날짜를 조율해 확정하는 단위. 이 서비스의 핵심 엔티티이며 flows.yaml 상태 전이의 대상.
    fields:
      - name: couple
        type: ref
        required: true
        note: 이 모임이 속한 커플 (ENT-07). 통합 조망(REQ-10)의 기준이 된다.
      - name: title
        type: string
        required: false
        note: 예 — 1월 대학동기 모임 (선택 입력)
      - name: status
        type: enum
        required: true
        note: "값 — 회신중 / 확정대기 / 확정됨 / 완료 / 취소됨 (REQ-12, flows.yaml ST-01~05)"
      - name: created_by
        type: ref
        required: true
        note: 모임을 만든 계정 (ENT-06)
      - name: rsvp_deadline
        type: datetime
        required: true
        note: REQ-07. 우회 생성(RISK-05)된 모임은 비어 있을 수 있다.
      - name: confirmed_candidate
        type: ref
        required: false
        note: 확정된 날짜후보(ENT-04). 확정 전에는 비어 있다.
      - name: is_urgent_bypass
        type: bool
        required: true
        note: RISK-05. 후보 제시·회신 수합을 생략하고 바로 확정한 긴급 모임인지
      - name: created_at
        type: datetime
        required: true
    relations:
      - to: ENT-04
        type: 1:N
        note: 모임 하나에 날짜 후보 여러 개.

  - id: ENT-04
    name: 날짜후보
    description: 모임에 제안된 날짜·시간 옵션.
    fields:
      - name: meeting
        type: ref
        required: true
        note: ENT-03
      - name: datetime
        type: datetime
        required: true
      - name: note
        type: string
        required: false
    relations:
      - to: ENT-05
        type: 1:N
        note: 날짜 후보 하나에 참가자별 회신 여러 건.

  - id: ENT-05
    name: 회신
    description: 지인이 특정 날짜 후보에 대해 남긴 참석 가능 여부.
    fields:
      - name: candidate
        type: ref
        required: true
        note: ENT-04
      - name: person
        type: ref
        required: true
        note: ENT-01
      - name: availability
        type: enum
        required: true
        note: "값 — 가능 / 불가능 / 미응답"
      - name: responded_at
        type: datetime
        required: false
    relations: []

  - id: ENT-06
    name: 계정
    description: 예비신부(ROLE-01) 또는 예비신랑(ROLE-02)의 로그인 계정.
    fields:
      - name: name
        type: string
        required: true
      - name: side
        type: enum
        required: true
        note: "값 — 신부 / 신랑. ROLE-01 / ROLE-02에 대응"
      - name: phone
        type: string
        required: true
      - name: couple
        type: ref
        required: true
        note: 소속 커플 (ENT-07). 배우자와 연결되기 전에는 비어 있을 수 있다.
      - name: created_at
        type: datetime
        required: true
    relations: []

  - id: ENT-07
    name: 커플
    description: >
      서비스를 함께 쓰는 예비부부 단위. 이 플랫폼은 여러 커플이 함께 쓰는 구조를 전제한다 —
      초대받은 지인(ROLE-03)이 여러 커플의 요청을 한 곳에서 보려면(REQ-15) 지인·계정이
      커플 경계를 넘어 전화번호로 식별될 수 있어야 한다 (users.md RISK-10 참고).
    fields:
      - name: wedding_date
        type: date
        required: false
      - name: created_at
        type: datetime
        required: true
    relations:
      - to: ENT-06
        type: 1:N
        note: 정확히 2개(신부측 1, 신랑측 1)여야 한다 — 그 이상·이하는 애플리케이션 레벨에서 막는다 (FLW-03 참고).
      - to: ENT-03
        type: 1:N
        note: 한 커플에 여러 모임이 속한다. 통합 조망(REQ-10)의 기준.

# ─────────────────────────────────────────
# 2. 화면
# ─────────────────────────────────────────
screens:
  - id: SCR-01
    name: 홈
    purpose: 로그인 직후 진입점으로, 조치가 필요한 모임과 이번 주 예정을 한눈에 보여준다.
    roles: [ROLE-01, ROLE-02]
    entities: [ENT-03]
    requirements: [REQ-12]
    entry_points: ["로그인"]
    key_info:
      - 진행 상태별 모임 건수 (회신중/확정대기/확정/완료)
      - 이번 주 확정된 모임 목록
      - 회신 마감이 임박하거나 지난 모임 알림
    actions:
      - 모임 편성 화면으로 이동
      - 전체 일정 조망으로 이동
      - 지인 관리로 이동
    states:
      - type: empty
        description: 등록된 지인·모임이 하나도 없는 최초 진입 (RISK-07) — 온보딩(ONB-01)의 미완 단계를 "다음 할 일"로 표시하고 지인 등록으로 유도. 배우자 미연결이면 초대 코드 발급도 함께 유도
      - type: loading
        description: 요약 데이터 집계 중
    notes: 회원가입·시작 설정은 SCR-11에서 다룬다 (STEP 4 온보딩에서 추가). 온보딩 완료 판정(POL-26)에 따라 빈 상태와 일반 상태를 가른다.

  - id: SCR-02
    name: 지인 목록
    purpose: 등록된 지인을 검색·필터링하고 관리한다.
    roles: [ROLE-01, ROLE-02]
    entities: [ENT-01, ENT-02]
    requirements: [REQ-01, REQ-02, REQ-03]
    entry_points: [SCR-01]
    key_info:
      - 지인 이름
      - 소속 그룹 태그 (복수 노출)
      - 연락처
      - 전체 등록 인원 수
    actions:
      - 지인 추가
      - 지인 상세/수정 진입
      - 그룹별 필터
      - 이름 검색
    states:
      - type: empty
        description: 등록된 지인이 0명인 최초 상태 (RISK-07)
      - type: large-dataset
        description: 최대 100명 이상 등록 시 검색·그룹 필터 없이는 특정인을 찾기 어려움 (RISK-06)
      - type: loading
        description: 목록 조회 중

  - id: SCR-02.1
    name: 지인 등록/수정
    purpose: 지인 한 명의 정보를 입력하거나 수정한다.
    roles: [ROLE-01, ROLE-02]
    entities: [ENT-01, ENT-02]
    requirements: [REQ-01, REQ-02, REQ-03]
    entry_points: [SCR-02]
    key_info:
      - 이름·연락처 입력값
      - 기존 그룹 목록에서 다중 선택 가능 여부
      - 새 그룹 즉시 생성 가능 여부
    actions:
      - 저장
      - 취소
      - 삭제 (수정 모드일 때)
    states:
      - type: error
        description: 연락처 형식 오류, 이름 미입력 등 필수값 누락
      - type: loading
        description: 저장 처리 중
    notes: 뒤로가기 시 SCR-02로 복귀하므로 독립 화면이 아닌 부속(SCR-02.1)으로 취급.

  - id: SCR-03
    name: 그룹 관리
    purpose: 지인을 묶는 그룹을 만들고 이름을 관리한다.
    roles: [ROLE-01, ROLE-02]
    entities: [ENT-02]
    requirements: [REQ-03]
    entry_points: [SCR-02]
    key_info:
      - 그룹명
      - 그룹별 소속 인원 수
    actions:
      - 그룹 생성
      - 그룹명 수정
      - 그룹 삭제
    states:
      - type: empty
        description: 생성된 그룹이 없는 상태 (RISK-07)
      - type: loading
        description: 목록 조회 중

  - id: SCR-04
    name: 모임 목록
    purpose: 모임을 진행 상태별로 구분해 조회한다.
    roles: [ROLE-01, ROLE-02]
    entities: [ENT-03]
    requirements: [REQ-12]
    entry_points: [SCR-01]
    key_info:
      - 모임명 또는 참가자 요약
      - 진행 상태 배지 (회신중/확정대기/확정/완료/취소됨)
      - 회신 마감일 또는 확정일
      - 회신 현황 (n/m)
    actions:
      - 모임 편성으로 이동
      - 상태별 탭 전환
      - 모임 상세로 이동
    states:
      - type: empty
        description: 상태 탭별로 해당 모임이 0건인 경우 (RISK-07)
      - type: partial
        description: 회신 마감 전 일부 인원만 회신 완료 (RISK-08)
      - type: large-dataset
        description: 3개월간 40건 이상 누적 시 필터·정렬 필요 (RISK-06)
      - type: loading
        description: 목록 조회 중

  - id: SCR-05
    name: 모임 편성
    purpose: 지인을 선택해 새 모임을 만들고 날짜 후보와 회신 마감을 설정한다.
    roles: [ROLE-01, ROLE-02]
    entities: [ENT-01, ENT-03, ENT-04]
    requirements: [REQ-04, REQ-05, REQ-07]
    entry_points: [SCR-04, SCR-01]
    key_info:
      - 선택 가능한 지인 목록 (그룹 필터 포함)
      - 선택된 인원 수
      - 제안할 날짜 후보 목록
      - 회신 마감 기한 입력값
      - 긴급 모임(우회) 여부 선택 (RISK-05)
    actions:
      - 지인 선택/해제
      - 날짜 후보 추가/삭제
      - 회신 마감 기한 설정
      - 긴급 모임으로 바로 확정 (후보 제시 생략)
      - 모임 생성
    states:
      - type: empty
        description: 등록된 지인이 없어 선택할 대상이 없는 경우 — 지인 등록으로 유도
      - type: error
        description: 날짜 후보 미입력 등 필수값 누락 (긴급 모임이 아닌 경우)
      - type: loading
        description: 생성 처리 중

  - id: SCR-06
    name: 모임 상세
    purpose: 하나의 모임의 회신 현황을 확인하고 최종 날짜를 확정하거나 취소한다.
    roles: [ROLE-01, ROLE-02]
    entities: [ENT-03, ENT-04, ENT-05, ENT-01]
    requirements: [REQ-06, REQ-08, REQ-09, REQ-11]
    entry_points: [SCR-04]
    key_info:
      - 참가자별 회신 현황 (가능/불가능/미응답)
      - 날짜 후보별 가능 인원 수
      - 회신 마감까지 남은 시간 또는 마감 초과 여부
      - 같은 날짜에 겹치는 다른 모임 경고 (RISK-03)
      - 확정된 날짜 (확정 후)
    actions:
      - 날짜 확정
      - 회신 마감 기한 연장
      - 구성원 추가/제외
      - 모임 취소
    states:
      - type: partial
        description: 일부 인원만 회신 완료 (RISK-08)
      - type: error
        description: 전원 회신이 불가능으로 몰려 확정할 수 있는 날짜가 없음
      - type: no-permission
        description: 배우자가 만든 모임은 열람·회신 확인은 가능하나 확정·취소는 정책에 따라 제한될 수 있음 (TBD, policy.md 참고)
      - type: loading
        description: 상세 조회 중

  - id: SCR-07
    name: 전체 일정 조망
    purpose: 신부측·신랑측 확정 모임을 통합해 달력 형태로 조회하고 날짜 겹침을 확인한다.
    roles: [ROLE-01, ROLE-02]
    entities: [ENT-03, ENT-07]
    requirements: [REQ-10, REQ-11]
    entry_points: [SCR-01]
    key_info:
      - 월별 확정 모임 목록
      - 날짜별 모임 건수
      - 겹치는 날짜 강조 표시
      - 신부측/신랑측/공동(양가) 구분 표시
    actions:
      - 월 이동
      - 특정 모임 상세로 이동
    states:
      - type: empty
        description: 아직 확정된 모임이 없는 상태 (RISK-07)
      - type: loading
        description: 월별 데이터 조회 중

  - id: SCR-08
    name: 내 초대 목록
    purpose: 초대받은 지인이 자신에게 온 모든 모임 요청(여러 커플 포함)을 한 곳에서 확인한다.
    roles: [ROLE-03]
    entities: [ENT-01, ENT-03]
    requirements: [REQ-14, REQ-15]
    entry_points: ["초대 링크 (외부, 문자·카카오 등)"]
    key_info:
      - 요청한 커플 또는 모임명
      - 회신 마감까지 남은 시간 또는 마감 초과 여부
      - 회신 완료/미응답 여부
      - 여러 커플의 요청이 있는 경우 모두 목록으로 노출
    actions:
      - 모임별 회신 화면으로 이동
    states:
      - type: empty
        description: 전화번호로 식별되는 요청이 이 요청 하나뿐인 경우 — 목록 없이 바로 회신 화면으로 진입해도 무방 (TBD, _handoff.md 참고)
      - type: error
        description: 만료되었거나 유효하지 않은 링크
      - type: loading
        description: 요청 목록 조회 중

  - id: SCR-09
    name: 회신 입력
    purpose: 특정 모임의 날짜 후보에 대해 참석 가능 여부를 표시하고 제출한다.
    roles: [ROLE-03]
    entities: [ENT-04, ENT-05]
    requirements: [REQ-06, REQ-09, REQ-14]
    entry_points: [SCR-08, "초대 링크 (외부, 단일 모임 직접 진입)"]
    key_info:
      - 모임을 제안한 커플/구성원 정보
      - 날짜 후보 목록과 마감 기한
      - 확정된 경우 최종 날짜
    actions:
      - 날짜별 가능/불가능 선택
      - 회신 제출 또는 수정
    states:
      - type: error
        description: 회신 마감이 지나 더 이상 입력할 수 없음 (RISK-02) — 확정된 날짜가 있으면 결과만 표시
      - type: no-permission
        description: 유효하지 않은 초대 식별자로 접근
      - type: loading
        description: 제출 처리 중

  - id: SCR-10
    name: 계정 설정
    purpose: 배우자 계정과 연결해 하나의 커플로 묶고 내 계정 정보를 관리한다.
    roles: [ROLE-01, ROLE-02]
    entities: [ENT-06, ENT-07]
    requirements: [REQ-13]
    entry_points: [SCR-01, SCR-11]
    key_info:
      - 배우자 연결 상태 (연결됨/미연결)
      - 배우자 초대 코드 발급/입력
      - 내 계정 정보 (이름·연락처)
    actions:
      - 배우자 초대 코드 생성
      - 배우자 초대 코드 입력해 연결
      - 내 정보 수정
    states:
      - type: empty
        description: 배우자와 아직 연결되지 않은 상태 — 핵심 기능(통합 조망) 사용 전 필수 단계
      - type: error
        description: 잘못되었거나 이미 사용된 초대 코드
      - type: loading
        description: 연결 처리 중

  - id: SCR-11
    name: 회원가입·시작 설정
    purpose: 계정을 만들고, 새 커플을 시작할지 배우자의 초대 코드로 합류할지 정한다.
    roles: [ROLE-01, ROLE-02]
    entities: [ENT-06, ENT-07]
    requirements: [REQ-13]
    entry_points: ["앱/웹 직접 접속 (미가입)", "배우자 초대 링크 (코드가 미리 채워진 상태)"]
    key_info:
      - 이름·연락처 입력값 (인증 방식은 TBD — POL-27)
      - "새로 시작" / "초대 코드로 합류" 선택
      - 새로 시작 시 결혼 예정일 (미정 허용, POL-25)
      - 초대 코드로 합류 시 초대한 배우자 이름과 결혼 예정일 (다시 묻지 않고 보여주기만)
    actions:
      - 계정 생성
      - 결혼 예정일 입력 또는 "아직 미정" 선택
      - 초대 코드 입력해 합류
    states:
      - type: error
        description: 필수값 누락, 잘못되었거나 이미 사용된 초대 코드 (POL-08)
      - type: loading
        description: 계정 생성·커플 연결 처리 중
    notes: STEP 4 온보딩에서 추가된 화면. ONB-01·ONB-02의 첫 단계다. 원본 PRD에 가입 방식은 없어 인증 수단은 TBD(POL-27)로 두고, 무엇을 입력받는지(결혼 예정일)만 여기서 확정했다 — 이전까지 ENT-07.wedding_date를 입력받는 화면이 없었다.

