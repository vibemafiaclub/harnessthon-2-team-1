# 온보딩 — 신규 사용자가 처음 진입해 첫 가치를 경험하기까지의 경로
# 역할마다 최소 하나. 같은 역할이라도 진입 상태(entry_state)가 다르면 경로를 나눈다.

meta:
  project: ""
  updated: ""

paths:
  - id: ONB-01
    name: ""
    role: ROLE-01
    entry: ""                       # 처음 어떻게 도달하는가 — 앱스토어 / 검색 / 초대 링크 / 공동 소유자의 초대
    entry_state: empty              # empty(빈 공간에서 시작) / shared(남이 만든 데이터가 있는 공간에 합류, RISK-04) / invited(링크로 특정 항목에 직행, RISK-10)
    first_value:
      screen: SCR-01                # 첫 가치가 일어나는 화면. first_value의 첫 키여야 한다
      description: ""               # "쓸모 있다"를 처음 느끼는 사건. 화면 이름이 아니라 사건으로 쓴다
    steps:                          # 첫 가치까지의 순서. 각 단계는 screen 키로 시작한다
      - screen: SCR-01
        goal: ""                    # 이 단계에서 사용자가 이루는 것 (결과로)
        required: true              # 없으면 first_value.screen이 동작하지 않을 때만 true
        required_reason: ""         # required: true면 필수. "없으면 첫 가치 화면이 동작하지 않는다"만 허용
        skip_to: null               # required: false면 필수. 건너뛰면 어느 화면으로 가는가 (SCR-)
        creates: [ENT-01]           # 이 단계에서 생기는 데이터. 비어 있으면 설명만 하는 단계일 수 있다
        resolves_empty_state: null  # 이 단계가 해소하는 빈 상태의 화면 (SCR-). ia.yaml에 empty 상태가 있어야 한다
    completion:
      criteria: ""                  # 데이터로 판정 가능한 완료 조건. 예) ENT-01 1건 이상 AND ENT-03 1건 이상
      re_entry: ""                  # 중도 이탈 후 재진입 시 어디서부터 재개하는가. 처음부터 다시 시키지 않는다
      reminder: ""                  # 이탈자 리마인드 (RISK-11). POL- 참조, 안 하면 none 과 이유
    exceptions:                     # 비워두지 않는다
      - condition: ""
        handling: ""                # SCR- 와 POL- 참조
