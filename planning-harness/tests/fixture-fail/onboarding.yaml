paths:
  - id: ONB-01
    name: 첫 지인 등록
    role: ROLE-01
    entry: 직접 접속
    entry_state: empty
    first_value:
      screen: SCR-01
      description: 첫 지인이 목록에 보이는 순간
    steps:
      - screen: SCR-01
        goal: 지인 1명 등록
        required: true
        required_reason: 지인이 없으면 목록(SCR-01)이 비어 있다
        skip_to: null
        creates: [ENT-01]
        resolves_empty_state: SCR-01
    completion:
      criteria: ENT-01 1건 이상
      re_entry: 다음 미완 단계부터
      reminder: none
    exceptions:
      - condition: 가입 후 이탈
        handling: SCR-01 빈 상태에서 유도 (POL-01)
  - id: ONB-02
    name: 초대받은 지인의 첫 회신
    role: ROLE-02
    entry: 초대 링크
    entry_state: invited
    first_value:
      screen: SCR-09
      description: 회신을 제출한 순간
    steps:
      - screen: SCR-09
        goal: 회신 제출
        required: true
        required_reason: 회신이 곧 첫 가치다
        skip_to: null
        creates: []
        resolves_empty_state: null
    completion:
      criteria: 회신 1건 이상
      re_entry: 같은 링크로 재진입
      reminder: none
    exceptions:
      - condition: 링크 만료
        handling: SCR-09 error (POL-01)
